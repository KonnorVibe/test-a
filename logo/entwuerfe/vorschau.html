<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aya Icon Runde 1</title>
<style>
  :root { --bg:#f4f1ec; --card:#fbfaf7; --ink:#2a2622; --muted:#7a716a; --tile-l:#f1ece5; --mark-l:#2a2622; --tile-d:#1d1a18; --mark-d:#efe9e1; --line:#e3ddd5; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141210; --card:#1c1917; --ink:#ece6de; --muted:#9a9089; --line:#2c2825; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, system-ui, sans-serif; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; } .lead { color:var(--muted); margin:0 0 24px; max-width:60ch; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .card h2 { font-size:17px; margin:0; } .card p { margin:4px 0 12px; color:var(--muted); font-size:14px; }
  .verdict { font-size:13px; color:var(--ink); border-left:3px solid var(--line); padding-left:8px; margin-bottom:12px; }
  .row { display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  .tile { border-radius:22.37%; display:grid; place-items:center; flex:none; }
  .tile svg { width:78%; height:78%; }
  .l { background:var(--tile-l); color:var(--mark-l); box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  .d { background:var(--tile-d); color:var(--mark-d); }
  .t96 { width:96px; height:96px; } .t60 { width:60px; height:60px; } .t32 { width:32px; height:32px; border-radius:7px; } .t16 { width:16px; height:16px; border-radius:3.5px; }
  .mono { width:96px; height:96px; color:var(--ink); display:grid; place-items:center; } .mono svg { width:78%; height:78%; }
  .lockup { display:flex; align-items:center; gap:8px; margin-top:12px; color:var(--ink); }
  .lockup svg { width:36px; height:36px; } .lockup span { font-size:28px; font-weight:600; letter-spacing:-0.01em; }
  .cap { font-size:11px; color:var(--muted); text-align:center; margin-top:2px; }
  .cell { display:flex; flex-direction:column; align-items:center; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="m1" viewBox="0 0 100 100"><circle cx="45" cy="54" r="18.5" fill="none" stroke="currentColor" stroke-width="9"/><path d="M68 34.5v39" stroke="currentColor" stroke-width="9" stroke-linecap="round"/></symbol>
  <symbol id="m2" viewBox="0 0 100 100"><path fill="currentColor" d="M40 18 A34 34 0 0 0 40 82 A44 44 0 0 1 40 18Z M60 18 A34 34 0 0 1 60 82 A44 44 0 0 0 60 18Z"/><circle cx="50" cy="50" r="6.5" fill="currentColor"/></symbol>
  <symbol id="m3" viewBox="0 0 100 100"><path d="M76.3 40.4 A28 28 0 1 1 50 22" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/><circle cx="66.1" cy="27.1" r="5" fill="currentColor"/></symbol>
  <symbol id="m4" viewBox="0 0 100 100"><g stroke="currentColor" stroke-width="8"><path d="M20 40 L40 20" stroke-dasharray="14 8"/><path d="M20 60 L60 20" stroke-dasharray="14 8" stroke-dashoffset="7"/><path d="M20 80 L80 20" stroke-dasharray="14 8" stroke-dashoffset="14"/><path d="M40 80 L80 40" stroke-dasharray="14 8" stroke-dashoffset="21"/><path d="M60 80 L80 60" stroke-dasharray="14 8" stroke-dashoffset="28"/></g></symbol>
  <symbol id="m5" viewBox="0 0 100 100"><path fill="currentColor" fill-rule="evenodd" d="M50 20 C70 20 82 36 80 54 C78 72 64 82 48 80 C30 78 20 64 22 48 C24 32 34 20 50 20Z M62 40 m-6.5 0 a6.5 6.5 0 1 0 13 0 a6.5 6.5 0 1 0 -13 0Z"/></symbol>
  <symbol id="m6" viewBox="0 0 100 100"><path d="M27 79 L50 23 L73 79" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="62" r="6" fill="currentColor"/></symbol>
  <symbol id="m7" viewBox="0 0 100 100"><g fill="currentColor"><circle cx="26" cy="66" r="6"/><circle cx="46" cy="52" r="9"/><circle cx="71" cy="38" r="12.5"/></g></symbol>
  <symbol id="m8" viewBox="0 0 100 100"><text x="50" y="62" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="36" font-weight="600" fill="currentColor" letter-spacing="-0.5">aya</text></symbol>
</svg>

<h1>Aya: App-Icon, Runde 1</h1>
<p class="lead">Acht Formideen, bewusst einfarbig. Farben kommen erst in Phase 2 und 4. Jede Idee auf hellem und dunklem Grund, einfarbig ohne Fläche, in Homescreen-Größe (60 px), als Favicon (32 und 16 px) und neben dem Schriftzug. Ziel: auf dem Homescreen nichts verraten.</p>

<div class="grid" id="grid"></div>

<script>
const concepts = [
  ["m1","1 · Monogramm a","Kleines a aus Kreis und Strich, wie ein Buchstabe aus der Systemschrift.","Solide und sehr diskret. Wirkt eher wie ein Werkzeug als eine Gesundheits-App. Etwas brav."],
  ["m2","2 · Spiegel","Aya ist ein Palindrom: vorwärts wie rückwärts gleich, so wie ein Zyklus zu sich zurückkehrt. Zwei gespiegelte Bögen um einen Punkt.","Stärkste Idee, weil sie eine eigene Bedeutung hat. In der Umsetzung aber noch nicht gut: Es liest sich wie ein Funk- oder Hotspot-Symbol. Gut als Ausgangspunkt für Runde 2, etwa mit weniger runden Bögen oder ohne Klammer-Wirkung."],
  ["m3","3 · Offener Ring","Ein Kreis mit Lücke und einem Punkt darin. Kreislauf, aber noch nicht geschlossen.","Gut lesbar bis 16 px. Sieht aber aus wie ein Fitness- oder Fortschrittsring, wenig eigenständig."],
  ["m4","4 · Köper","Aya heißt auf Japanisch auch Köperbindung, ein Webmuster mit diagonalen Linien.","Diskret, aber in dieser Umsetzung eher Pixelmuster als Gewebe. Bei 16 px nur noch Rauschen."],
  ["m5","5 · Kiesel","Ein ruhiger, organischer Stein mit einer kleinen Öffnung.","Schwach. Wirkt wie ein Auge oder eine Kugel und ist beliebig."],
  ["m6","6 · Monogramm A","Großes A ohne Querstrich, der Querstrich ist ein Punkt.","Klar und klein lesbar. Erinnert an Dreieck oder Warnschild, das passt nicht zum ruhigen Charakter."],
  ["m7","7 · Verlauf","Drei wachsende Punkte, die eine Entwicklung über die Zeit andeuten.","Schwach. Wirkt generisch und erinnert an Lade- oder Börsen-Symbole."],
  ["m8","8 · Wortmarke","Einfach der Name in Kleinbuchstaben.","Maximal neutral, aber bei 32 und 16 px unlesbar. Taugt nur, wenn das Favicon eine eigene Form bekommt."],
];
const use = id => `<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#${id}"/></svg>`;
document.getElementById("grid").innerHTML = concepts.map(([id,title,meaning,verdict]) => `
  <section class="card">
    <h2>${title}</h2><p>${meaning}</p><div class="verdict">${verdict}</div>
    <div class="row">
      <div class="cell"><div class="tile l t96">${use(id)}</div><div class="cap">hell</div></div>
      <div class="cell"><div class="tile d t96">${use(id)}</div><div class="cap">dunkel</div></div>
      <div class="cell"><div class="mono">${use(id)}</div><div class="cap">einfarbig</div></div>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="cell"><div class="tile l t60">${use(id)}</div><div class="cap">60</div></div>
      <div class="cell"><div class="tile d t60">${use(id)}</div><div class="cap">60</div></div>
      <div class="cell"><div class="tile l t32">${use(id)}</div><div class="cap">32</div></div>
      <div class="cell"><div class="tile d t32">${use(id)}</div><div class="cap">32</div></div>
      <div class="cell"><div class="tile l t16">${use(id)}</div><div class="cap">16</div></div>
      <div class="cell"><div class="tile d t16">${use(id)}</div><div class="cap">16</div></div>
    </div>
    <div class="lockup">${use(id)}<span>Aya</span></div>
  </section>`).join("");
</script>
</body>
</html>
